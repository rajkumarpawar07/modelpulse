name: Daily ModelPulse Scrape

# Runs the full ModelPulse pipeline once a day at 09:00 UTC.
# Includes auto-heal: if any collector fails, the pipeline attempts to
# heal and re-run it automatically. Same c_* collector IDs throughout.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "collectors.json"
      - ".github/workflows/daily-scrape.yml"

# Cancel in-progress runs on new push to save credits.
concurrency:
  group: modelpulse-scrape
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      DATABASE_PATH: ./data/modelpulse.db
      AUTO_HEAL: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run the full pipeline (scrape → auto-heal → diff → alert)
        run: npm run all

      - name: Upload raw outputs (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelpulse-raw
          path: raw/
          retention-days: 7

      # Commit the database back so history accumulates across runs and the
      # deployed dashboard always serves fresh data. The DB is synced into
      # dashboard/ too — that copy is what Vercel deploys, and pushing it
      # redeploys the dashboard automatically. The push paths filter above
      # (src/**, collectors.json, workflow) means this data commit does not
      # re-trigger the workflow.
      - name: Commit updated database
        if: success()
        run: |
          # Flush the WAL into the main DB file so the committed .db is complete
          node -e "const D=require('better-sqlite3');const d=new D('./data/modelpulse.db');d.pragma('wal_checkpoint(TRUNCATE)');d.close()"
          cp data/modelpulse.db dashboard/data/modelpulse.db
          # The deployed copy must NOT be in WAL mode: Vercel's read-only
          # filesystem can't create the -shm/-wal sidecars a WAL database
          # needs even for readonly opens. Rollback journal opens clean.
          node -e "const D=require('better-sqlite3');const d=new D('./dashboard/data/modelpulse.db');d.pragma('journal_mode = DELETE');d.close()"
          cp collectors.json dashboard/collectors.json
          git config user.name "modelpulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/modelpulse.db dashboard/data/modelpulse.db dashboard/collectors.json
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(data): daily scrape update [skip ci]"
            git push
          fi

      - name: Upload database snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelpulse-db
          path: data/modelpulse.db
          retention-days: 30
