# Add this file to any repo that builds on AI vendor APIs.
# Fails the workflow when ModelPulse saw breaking changes in the last 7 days.
#
# Setup (one time):
#   1. Copy ci/check-breaking.mjs from the modelpulse repo into your repo
#      (e.g. to .github/modelpulse/check-breaking.mjs). Vendoring the script
#      means CI never executes remote code — you review every change to it.
#   2. Add your ModelPulse instance URL as the MODEL_PULSE_URL secret.
name: ModelPulse breaking-change check

on:
  schedule:
    - cron: "0 9 * * 1-5"   # weekdays before work hours
  workflow_dispatch:

jobs:
  breaking-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ModelPulse for breaking changes
        env:
          MODEL_PULSE_URL: ${{ secrets.MODEL_PULSE_URL }}
          MODEL_PULSE_DAYS: "7"
          # MODEL_PULSE_VENDOR: openai   # optional: only watch one vendor
          MODEL_PULSE_MODE: fail         # fail | warn
        run: node .github/modelpulse/check-breaking.mjs
